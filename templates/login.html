{% extends "base.html" %}
{% block title %}Log in{% endblock %}

{% block body %}
<form class="lsform" action="" method="POST" novalidate>
    {{ f.hidden_tag() }}
    {{ f.username() }}
    {% for e in f.username.errors %}<p>{{e}}</p>{% endfor %}
    {{ f.password() }}
    {% for e in f.password.errors %}<p>{{e}}</p>{% endfor %}
    {{ f.submit() }}
</form>
{% endblock %}
